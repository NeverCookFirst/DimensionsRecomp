#
# Analysis pass 1 (2026-08-31) ended with:
#   UnresolvedCall (3):
#     0x8307CA78 from 0x8277D4B8
#     0x82D73A10 from 0x82D7847C
#     0x82D73A10 from 0x82D784C8
# All three are unconditional `b` (not `bl`) into an address the discovery pass
# never claimed for a function - the classic tail-call-into-undiscovered-code
# shape. Declaring the target as a function entry is the documented fix; size is
# left out so the analyser sizes each one itself. If a size turns out to be
# required, add `size = <bytes>` or `end = 0x...` here (they are mutually
# exclusive) and re-run codegen.

